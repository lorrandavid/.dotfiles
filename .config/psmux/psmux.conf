# Plugins are installed outside the dotfiles repository under ~/.psmux/plugins.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-pain-control'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'
set -g @plugin 'psmux-plugins/psmux-prefix-highlight'
set -g @plugin 'psmux-plugins/psmux-cpu'
set -g @plugin 'psmux-plugins/psmux-git-status'
set -g @plugin 'psmux-plugins/psmux-theme-tokyonight'

# The CPU and Git plugins register foreground polling hooks, which makes psmux
# show a persistent "running: pwsh ..." message. Replace those hooks with the
# same commands in background mode after the plugins have loaded.
set-hook -g client-attached 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-cpu/scripts/system_stats.ps1\""'
set-hook -ga client-attached 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-git-status/scripts/git_status.ps1\""'
set-hook -g status-interval 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-cpu/scripts/system_stats.ps1\""'
set-hook -ga status-interval 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-git-status/scripts/git_status.ps1\""'

# psmux-yank was retired after clipboard support moved into psmux itself.
set -g set-clipboard on

# Keep the Tokyo Night styling while exposing the values populated by the status
# plugins. This must come after the plugin declarations because their static
# defaults also set status-right while psmux parses the config.
set -g status-right "#{?client_prefix,#[bg=#ff9e64,fg=#16161e,bold] PREF #[default],}#{?pane_in_mode,#[bg=#7aa2f7,fg=#16161e,bold] COPY #[default],}#{?synchronize-panes,#[bg=#f7768e,fg=#16161e,bold] SYNC #[default],} #{git_status} #[fg=#565f89]│ #[fg=#c0caf5]CPU #{@cpu_percentage} MEM #{@ram_percentage} #[fg=#565f89]│ #[fg=#7dcfff]%H:%M"
set -g status-right-length 120

# PPM must be initialized last.
run '~/.psmux/plugins/ppm/ppm.ps1'
