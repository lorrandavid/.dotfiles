<!doctype html>
<html lang="{{LANG}}" data-template-version="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOCUMENT_TITLE}}</title>
<style>
:root {
  color-scheme: light;
  --canvas: #f4f7fb;
  --surface: #ffffff;
  --surface-subtle: #f8fafc;
  --ink: #172033;
  --muted: #657086;
  --line: #dce3ee;
  --brand: #2563eb;
  --brand-soft: #eaf1ff;
  --good: #147a55;
  --good-soft: #e8f7f0;
  --warn: #a15c00;
  --warn-soft: #fff4df;
  --danger: #b4233c;
  --danger-soft: #ffedf0;
  --neutral: #536178;
  --neutral-soft: #eef2f7;
  --radius: 14px;
  --shadow: 0 12px 34px rgba(34, 51, 84, .08);
}
* { box-sizing: border-box; }
html { background: var(--canvas); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
a { color: var(--brand); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .9em; overflow-wrap: anywhere; }
.page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 56px; }
.hero, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.hero { padding: 28px; margin-bottom: 18px; }
.eyebrow { margin: 0 0 6px; color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 6px; font-size: clamp(26px, 4vw, 42px); line-height: 1.12; letter-spacing: -.03em; }
h2 { margin-bottom: 16px; font-size: 21px; letter-spacing: -.015em; }
h3 { margin-bottom: 8px; font-size: 16px; }
.subtitle, .muted { color: var(--muted); }
.subtitle { margin-bottom: 0; font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: var(--muted); font-size: 13px; }
.panel { padding: 22px; margin-top: 18px; }
.banner { border-left: 5px solid var(--neutral); }
.banner.good { border-left-color: var(--good); background: linear-gradient(90deg, var(--good-soft), var(--surface) 38%); }
.banner.warn { border-left-color: var(--warn); background: linear-gradient(90deg, var(--warn-soft), var(--surface) 38%); }
.banner.danger { border-left-color: var(--danger); background: linear-gradient(90deg, var(--danger-soft), var(--surface) 38%); }
.banner.neutral { background: linear-gradient(90deg, var(--neutral-soft), var(--surface) 38%); }
.banner-label { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 8px; font-weight: 800; }
.banner-label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.banner p { margin-bottom: 4px; }
.relationship { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.tag-node { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-subtle); }
.tag-node strong, .tag-node code { display: block; }
.tag-node code { margin-top: 4px; color: var(--muted); }
.relation-arrow { min-width: 130px; color: var(--brand); text-align: center; font-weight: 800; }
.relation-arrow::after { content: ""; display: block; height: 2px; margin-top: 6px; background: var(--brand); }
.summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.side-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.side-card header { padding: 14px 16px; background: var(--surface-subtle); border-bottom: 1px solid var(--line); }
.side-card header h3 { margin: 0; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); }
.metric { padding: 14px; border-right: 1px solid var(--line); text-align: center; }
.metric:last-child { border-right: 0; }
.metric strong { display: block; font-size: 22px; line-height: 1.1; }
.metric span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.metric small { color: var(--muted); }
.feature { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.feature > header { padding: 15px 16px; background: var(--surface-subtle); }
.feature > .feature-body { padding: 10px 16px 14px; }
.item { padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
.item-title { font-weight: 750; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--neutral-soft); color: var(--neutral); font-size: 11px; font-weight: 800; white-space: nowrap; }
.badge.good { color: var(--good); background: var(--good-soft); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.danger { color: var(--danger); background: var(--danger-soft); }
.badge.brand { color: var(--brand); background: var(--brand-soft); }
.pr-links { margin-top: 5px; color: var(--muted); font-size: 13px; }
details { margin-top: 8px; }
summary { color: var(--brand); cursor: pointer; font-size: 13px; font-weight: 700; }
.detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 9px; }
.detail-box { padding: 10px 12px; border-radius: 9px; background: var(--surface-subtle); color: #354057; }
.list { margin: 0; padding-left: 20px; }
.list li + li { margin-top: 8px; }
.commit-row, .pr-row { padding: 12px 0; border-top: 1px solid var(--line); }
.commit-row:first-child, .pr-row:first-child { border-top: 0; }
.hash { color: var(--muted); }
.empty { padding: 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; }
.checklist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-subtle); }
.check::before { content: "□"; color: var(--neutral); font-size: 20px; line-height: 1; }
footer { padding-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 760px) {
  .page { width: min(100% - 20px, 1180px); padding-top: 14px; }
  .hero, .panel { padding: 18px; }
  .relationship { grid-template-columns: 1fr; }
  .relation-arrow { min-width: 0; }
  .relation-arrow::after { width: 2px; height: 26px; margin: 7px auto 0; }
  .summary-grid, .detail-grid, .checklist { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: 1fr; }
  .metric { border-right: 0; border-bottom: 1px solid var(--line); }
  .metric:last-child { border-bottom: 0; }
}
@media print {
  html, body { background: #fff; }
  .page { width: 100%; padding: 0; }
  .hero, .panel { box-shadow: none; break-inside: avoid; }
  details > * { display: block !important; }
}
</style>
</head>
<body>
<main class="page">
{{REPORT_BODY}}
<footer>{{FOOTER}}</footer>
</main>
</body>
</html>
